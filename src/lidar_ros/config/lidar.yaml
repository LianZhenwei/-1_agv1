filter:
    meanK: 50 #统计学离群点移除时的最近邻搜索点的个数
    StddevMulThreshv: 1.0 #统计学离群点移除时的高斯分布标准差阈值系数
    voxelGridSize: 0.02 # 记得该回0.02！
    roi:
        roi_x_min: -1
        roi_x_max: 10 # 记得改回10
        roi_y_min: -3 # 记得改回-3
        roi_y_max: 3  # 记得改回3
        roi_z_min: 0.2 # 记得该回0！
        roi_z_max: 1.5
    car:
        car_x_min: -1.8
        car_x_max: 0
        car_y_min: -0.45
        car_y_max: 0.45
        car_z_min: 0
        car_z_max: 1.3

plane_seg:
    RANSAC_max_iterations: 100
    plane_distance_Threshold: 0.1
    obstaclePointScale: 0.5

cluster:
    cluster_Tolerance: 0.4 # 记得该回0.4！
    cluster_size:
        min_cluster_size: 15 # 记得该回15！
        max_cluster_size: 1500 # 记得该回1500！


